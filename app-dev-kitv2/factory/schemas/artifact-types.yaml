# Artifact types: the vocabulary of stage.yaml inputs/outputs. One place says where each artifact
# lives and which schema validates it. Paths are relative to .factory/ (scope: app) or to
# .factory/features/<FEAT>-<slug>/ (scope: feature). `external` types come from outside the pipeline.
# format: yaml | json | frontmatter (YAML front matter + Markdown) | markdown | any
# producer: engine — written by the factory CLI itself (intake, notes, digest dispatch), not by a stage
# engine_writes: true — only the engine writes the file (an agent returns findings; the engine writes review.md)
inbox:              { scope: app, path: "inbox/**", format: any, external: true }
repository:         { scope: project, path: "**", format: any, external: true }
config:             { scope: app, path: factory.config.yaml, format: yaml, external: true }
normalised-sources: { scope: app, path: "context/normalised/*.md", format: markdown, producer: engine }
source-index:       { scope: app, path: context/index.yaml, format: yaml, schema: source-index, producer: engine }
coverage:           { scope: app, path: context/coverage.yaml, format: yaml, schema: coverage }
app-profile:        { scope: app, path: app-profile.yaml, format: yaml, schema: app-profile }
capability-index:   { scope: app, path: "_index/capability-map.yaml", format: yaml, schema: capability-map }
component-inventory: { scope: app, path: "_index/component-inventory.yaml", format: yaml, schema: component-inventory, producer: engine }
capability-slice:   { scope: app, path: "_index/slices/*.slice.md", format: markdown }
feature-ledger:     { scope: app, path: ledger/feature-ledger.yaml, format: yaml, schema: feature-ledger }
prd:                { scope: feature, path: 01-requirements/prd.md, format: frontmatter, schema: prd, ids: [REQ, AC, OQ, SRC, HD] }
delta-spec:         { scope: feature, path: 01-requirements/delta-spec.yaml, format: yaml, schema: delta-spec, ids: [REQ, AC, OQ, SRC, HD] }
open-questions:     { scope: feature, path: 01-requirements/open-questions.md, format: markdown, ids: [OQ] }
stories:            { scope: feature, path: 02-stories/stories.yaml, format: yaml, schema: stories, ids: [REQ, AC] }
ux-notes:           { scope: feature, path: 02-stories/ux-notes.md, format: markdown }
prototype-report:   { scope: feature, path: 02b-prototype/prototype-report.yaml, format: yaml, schema: prototype-report }
prototype-sandbox:  { scope: feature, path: "02b-prototype/sandbox/**", format: any }
component-map:      { scope: feature, path: 03-architecture/component-map.md, format: frontmatter, schema: component-map, ids: [ADR] }
adr:                { scope: feature, path: "03-architecture/adr-*.md", format: frontmatter, schema: adr, ids: [ADR] }
api-contract:       { scope: feature, path: 03-architecture/api-contract.yaml, format: yaml, ids: [AC] }
agent-design:       { scope: feature, path: 03-architecture/agent-design.md, format: markdown, ids: [AC, ADR] }
tasks:              { scope: feature, path: 04-plan/tasks.yaml, format: yaml, schema: tasks, ids: [AC] }
test-plan:          { scope: feature, path: 04-plan/test-plan.yaml, format: yaml, schema: test-plan, ids: [AC] }
human-notes:        { scope: feature, path: human-notes.yaml, format: yaml, schema: human-notes, ids: [HD], producer: engine }
digest:             { scope: feature, path: digest.md, format: markdown, producer: engine }
root-cause:         { scope: feature, path: "diagnosis/*.md", format: markdown, producer: engine }
acceptance-tests:   { scope: project, path: "**/*.acceptance.test.*", format: any }
change-set:         { scope: feature, path: 06-verify/change-set.yaml, format: yaml, schema: change-set, producer: engine, engine_writes: true }
change-diff:        { scope: feature, path: 06-verify/change.diff, format: any, producer: engine, engine_writes: true }
review:             { scope: feature, path: 06-verify/review.md, format: frontmatter, schema: review, producer: engine, engine_writes: true }
defects:            { scope: feature, path: 07-qa/defects.yaml, format: yaml, schema: defects }
qa-report:          { scope: feature, path: 07-qa/qa-report.md, format: markdown }
feature-doc:        { scope: project, path: "docs/features/*.md", format: markdown }
adr-doc:            { scope: project, path: "docs/adr/*.md", format: markdown }
changelog:          { scope: project, path: CHANGELOG.md, format: markdown }
docs-report:        { scope: feature, path: 08-delivery/docs-report.md, format: markdown }
pr-body:            { scope: feature, path: 08-delivery/pr.md, format: markdown }
commit-plan:        { scope: feature, path: 08-delivery/commits.yaml, format: yaml, schema: commit-plan }
pr-comments:        { scope: feature, path: 08-delivery/comments.json, format: json, producer: engine, engine_writes: true }
triage:             { scope: feature, path: 08-delivery/triage.yaml, format: yaml, schema: triage }
