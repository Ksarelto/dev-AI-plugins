feature: FEAT-001
stories:
  - id: STORY-0001
    traces: [REQ-0001, REQ-0003]
    as_a: support agent
    i_want: order amounts from the API with their currency
    so_that: I can read them to the customer as they are
    acs:
      - id: AC-0001
        gherkin: |
          Given an order of 1234 minor units in EUR
          When the API formats it
          Then it reads "12.34 EUR"
      - id: AC-0003
        gherkin: |
          Given an order of 1234 in JPY
          When the API and the web app format it
          Then the API reads "1234 JPY" and the web app shows "¥1,234"
  - id: STORY-0002
    traces: [REQ-0002]
    as_a: customer
    i_want: prices with the currency symbol
    so_that: I know what I pay
    acs:
      - id: AC-0002
        gherkin: |
          Given a price of 12.34 EUR
          When the web app shows it
          Then I see "€12.34"
    ux: { surfaces: [CheckoutSummary], states: [eur, jpy] }
