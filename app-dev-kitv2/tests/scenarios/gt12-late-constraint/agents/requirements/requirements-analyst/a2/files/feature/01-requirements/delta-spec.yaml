    text: Amounts in Japanese yen are shown without decimals, in the API and in the web app
    sources: [SRC-005, HD-1]
    priority: must
    acs:
      - { id: AC-0003, kind: edge, text: 'JPY has no decimals: formatMoney(1234, "JPY") returns "1234 JPY" and formatPrice(1234, "JPY") returns "¥1,234"' }
