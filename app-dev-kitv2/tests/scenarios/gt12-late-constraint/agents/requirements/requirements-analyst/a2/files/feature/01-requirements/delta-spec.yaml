feature: FEAT-001
mode: change-request
summary: Show amounts with their currency in the API and the web app
added:
  - id: REQ-0001
    text: The API formats order amounts with their ISO currency code
    sources: [SRC-002, SRC-004]
    priority: must
    acs:
      - { id: AC-0001, kind: happy, text: 'formatMoney(1234, "EUR") returns "12.34 EUR"' }
  - id: REQ-0002
    text: The web app shows prices with the currency symbol of the order
    sources: [SRC-003, SRC-004]
    priority: must
    acs:
      - { id: AC-0002, kind: happy, text: 'formatPrice(12.34, "EUR") returns "€12.34"' }
