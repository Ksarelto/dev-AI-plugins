<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — B2B ordering portal prototype</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/app.js" defer></script>
  <script src="../js/data.js" defer></script>
  <script src="../js/navigation.js" defer></script>
</head>
<body data-screen="checkout-summary">
  <div class="app">
    <aside class="sidebar"><nav aria-label="Main navigation" data-nav="page"></nav></aside>
    <main class="main" data-initial-state="applied">
      <div class="page-header"><h1 class="page-title">Checkout</h1></div>
      <p>Subtotal 100.00 EUR · Shipping 5.00 EUR</p>
      <form class="card field" aria-label="Coupon">
        <label for="coupon">Coupon code</label>
        <input id="coupon" class="input" name="coupon" required value="B2B10">
        <button type="submit" class="btn btn-primary">Apply</button>
      </form>
      <section data-state="empty" aria-label="No coupon entered"><p>Total 105.00 EUR</p></section>
      <section data-state="loading" aria-label="Applying the coupon" role="status"><div class="skeleton"></div></section>
      <section data-state="applied" aria-label="Coupon applied"><p>Discount -10.00 EUR</p><p>Total 95.00 EUR</p><button type="button" class="btn btn-link">Remove</button></section>
      <section data-state="invalid" aria-label="Coupon expired" role="alert"><p class="alert-error">This coupon has expired</p><p>Total 105.00 EUR</p></section>
      <section data-state="not-combinable" aria-label="Coupon not combinable" role="alert"><p class="alert-error">Coupons cannot be combined with the loyalty discount</p></section>
      <div class="dev-panel" role="toolbar" aria-label="Prototype states"></div>
    </main>
  </div>
</body>
</html>
