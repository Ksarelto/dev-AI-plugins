id: ai-tool-units
title: "AI-agent role on agent-boilerplate (patch tier): a tool red → green with a scripted model, an eval task to the eval author; the real eval run executes (skipped without a key, allowed here)"
repos: [{ from: agent-boilerplate, to: "." }]
stack_kits: [node-agent-dev-kit, node-backend-dev-kit]
intake: { title: Unit conversion tool }
config:
  roles:
    frontend: { enabled: false }
    ai-agent: { enabled: true, pack: factory-role-ai-agent, stack: node-agent-dev-kit, path: ".", owns_paths: ["src/**", "tests/**", "evals/**"] }
  quality: { allow_skipped_checks: true, integration_tests: skip }   # mocked runs: no model key, no Docker
  delivery: { pr: true }
  pipeline:
    profile: ai
    profiles: { ai: [intake, requirements-lite, implementation, verification-lite, delivery, feedback] }
expect:
  final_action: done
  final_status: done
  dispatches_max: 10
  build_dispatches: 1
  gates: [GATE-A, GATE-C]
  verdicts:
    - { stage: intake, verdict: advance }
    - { stage: requirements-lite, verdict: advance }
    - { stage: implementation, task: TASK-001, verdict: advance }   # one build dispatch: red tests, gate red, implementation
    - { stage: implementation, task: TASK-002, verdict: advance }
    - { stage: verification-lite, verdict: advance }
    - { stage: delivery, verdict: advance }
  models:
    ai-builder: sonnet
    eval-author: sonnet
    reviewer: opus
  ship: { commits: 3, dry_run: true, trailers: ["Factory-Task: TASK-001", "Factory-Task: TASK-002"] }
  ledger: changed
  files_contain:
    src/agents/assistant/tools/index.ts: "createConvertUnitsTool"
    evals/golden/assistant.json: "AC-0002"
    .factory/logs/TASK-001-impl-eval.log: "vitest run --project eval"
    .factory/logs/TASK-002-impl-eval.log: "vitest run --project eval"
