# Read by scripts/check-factory-consistency.mjs. Everything here is a deliberate, dated decision.
# Shrink the "later_phase" lists as each phase lands; the check fails if a designed agent or
# command is neither implemented nor listed here.

later_phase_agents:          # phase that builds them
  - intake-normaliser        # 2 factory-analysis
  - codebase-analyst         # 2
  - requirements-analyst     # 2
  - story-writer             # 2
  - solution-architect       # 2
  - contract-steward         # 2
  - planner                  # 2
  - test-strategist          # 2
  - fe-test-author           # 3 factory-role-frontend
  - fe-builder               # 3
  - fe-auditor               # 3
  - prototyper               # 3
  - acceptance-test-author   # 4 factory-quality
  - reviewer                 # 4
  - qa-engineer              # 4
  - tech-writer              # 4 factory-delivery
  - release-manager          # 4
  - be-test-author           # 5 factory-role-backend
  - be-builder               # 5
  - migration-author         # 5
  - be-auditor               # 5
  - ai-architect             # 5 factory-role-ai-agent
  - ai-builder               # 5
  - rag-builder              # 5
  - eval-author              # 5
  - ai-test-author           # 5

later_phase_commands:
  - intake                   # 2 (with the intake normaliser)
  - split                    # 3 (task-level escalation rung 4)
  - index                    # 3 (Cartographer v1)
  - ship                     # 4 (delivery)

# Artifact types whose producing stage arrives in a later phase.
pending_artifact_types: [normalised-sources, source-index, coverage, app-profile, capability-index,
  component-inventory, capability-slice, feature-ledger, prd, delta-spec, open-questions, stories,
  ux-notes, prototype-report, component-map, adr, api-contract, tasks, test-plan]

# Config keys and schema fields that are defined now but first read in a later phase.
later_phase_keys:
  - "budgets.task.* and budgets.prototype.* — read by the task loop and the prototype stage (phase 3)"
  - "prototype.trigger rules — evaluated by factory-role-frontend (phase 3); until then the prototype stage runs only when forced"
  - "roles.<role>.stack_overrides (package manager, commands) — read by the stack executor (phase 3)"
  - "envelope deviations / follow_up_suggested — read by the reviewer (phase 4)"

deviations:
  - "engine plugin is named `factory` (commands /factory:*), not `factory-core`"
  - "diagnostician lives in the engine (loop control), not in a stage pack"
  - "ai-test-author added: the role contract requires a test author per role"
  - "S9 feedback triage is a skill used by release-manager, not a feedback-triager agent"
  - "base-dev-kit gets no stack.yaml: it holds always-on rules, not a technology stack"
  - "subagents can spawn subagents (up to 3 levels); 'no sub-orchestrators' is a design choice, not a platform limit — Suggestions/02 and 10 to be corrected in phase 5"
  - "delta-spec is delta-spec.yaml everywhere (Suggestions/03 stage table says .md)"
  - "the diagnosis file is diagnosis/<stage-or-task>.md (Suggestions/09 calls it root-cause.md)"
  - "frontend-dev-kit's docs run scripts with yarn; deps-frontend uses pnpm — stack.yaml names scripts and defaults to pnpm, projects override the package manager"
  - "stage kind `script` dropped until a stage needs it (bootstrap may, in phase 5)"
  - "acceptance criteria carry their text in the spec ({id, text}); Suggestions/04 lists AC ids only"
  - "context: fork is used on /factory:doctor; failure-analysis needs none because the diagnostician already runs in its own context"
