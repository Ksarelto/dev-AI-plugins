# Read by scripts/check-factory-consistency.mjs. Everything here is a deliberate, dated decision.
# Shrink the "later_phase" lists as each phase lands; the check fails if a designed agent or
# command is neither implemented nor listed here.

later_phase_agents: []         # every designed agent is implemented

later_phase_commands:

# Artifact types whose producing stage arrives in a later phase.
pending_artifact_types:
  - capability-slice        # per-domain slices: Cartographer v2 (not built)
  - open-questions          # optional narrative; open questions live in the spec front matter

# Config keys and schema fields that are defined now but first read in a later phase.
later_phase_keys:
  - "budgets.prototype.tokens — the prototype stage's own token cap (revisions_max is enforced; tokens count in the feature budget)"
  - "flow.kanban.wip and quality.tdd.pipeline_red — multi-feature WIP limits and pipelined red phases (not built; role tracks use flow.role_tracks)"
  - "envelope deviations / follow_up_suggested — kept in envelopes/ for humans; no stage reads them yet"
  - "coverage of changed lines (quality.coverage_changed_lines_min) — needs a stack coverage command; not gated yet"

deviations:
  - "engine plugin is named `factory` (commands /factory:*), not `factory-core`"
  - "diagnostician lives in the engine (loop control), not in a stage pack"
  - "ai-test-author added: the role contract requires a test author per role"
  - "roles route specialist builders by task type (role.yaml agents.builders: migration → migration-author, rag → ai-rag-builder, eval → eval-author)"
  - "role gate scripts are role.yaml gates.checks run inside gate-impl (an eval run, a migration check), not separate gate-impl/gate-verify scripts per role"
  - "ai-architect joins the architecture stage through a role:architect slot and writes 03-architecture/agent-design.md"
  - "migration and eval tasks are TDD-exempt: a migration is proven by its rollback check and integration tests, an eval task is itself the test"
  - "S9 feedback triage is a skill used by release-manager, not a feedback-triager agent"
  - "base-dev-kit gets no stack.yaml: it holds always-on rules, not a technology stack"
  - "subagents can spawn subagents (up to 3 levels); 'no sub-orchestrators' is a design choice, not a platform limit (Suggestions/02 and 10 say so)"
  - "delta-spec is delta-spec.yaml everywhere (Suggestions/03 stage table says .md)"
  - "the diagnosis file is diagnosis/<stage-or-task>.md (Suggestions/09 calls it root-cause.md)"
  - "frontend-dev-kit's docs run scripts with yarn; deps-frontend uses pnpm — stack.yaml names scripts and defaults to pnpm, projects override the package manager"
  - "stage kind `script` dropped: engine work before a stage is `before: scaffold` (bootstrap)"
  - "the implementation stage manifest ships with the engine: the task loop is engine mechanics, routed by role.yaml"
  - "the prototype stage ships with factory-analysis and dispatches role:prototype_designer, then one role:prototyper per screen (stage fan_out); it is skipped when no enabled role has them"
  - "the prototype trigger is one deterministic rule (the stories have a ux.surfaces entry: a new, changed or removed screen), not the any/skip_all rule list sketched in Suggestions/03"
  - "the prototype is ONE living, clickable static-HTML prototype of the whole app in .factory/prototype/, updated in place by every feature with a UI change (snapshot at stage entry, restored on abort or factory proto --revert); Suggestions/03 sketches a per-feature sandbox in the app's real stack"
  - "the task wall-clock budget (Suggestions/09 hung-agent detection) is dropped: the Conductor cannot interrupt a running subagent; the feature wall-clock budget stays"
  - "the clean-tree precondition is 'no unexpected changes': the factory works in one checkout and commits at delivery, so the step halts only on files changed outside any dispatch since the engine's last action (factory accept-changes keeps them)"
  - "builders carry MCP tools (shadcn, context7) beyond the 5-tool guideline of Suggestions/05"
  - "builder packs carry the task type's stack rules, skills and golden files without the 8 KB reference target of Suggestions/00/07 (decided: detail over size)"
  - "spec completeness (10 weighted categories, >= quality.completeness_min) from spec-dev-kit is scored in gate-spec at the requirements stage; a low score gets one question round, then GATE-A shows the rest"
  - "role tracks run in parallel in the main checkout, one task per role, when roles have separate package paths (roles.<role>.path); no git worktrees — Suggestions/08 uses one worktree per track"
  - "the builder disputes a red test with a top-level envelope field test_dispute {test, reason} (Suggestions/03 sketches error.type: test_dispute)"
  - "red tests must be new files (gate-plan red-test-exists): extending an existing test file cannot produce a provable red"
  - "acceptance tests are their own stage (acceptance) between planning and implementation, written from the spec with src/ unreadable; task gates ignore *.acceptance.test.* files until verification"
  - "verification, QA and PR review share one fix loop (on_fail/on_reject fix:implementation): failures become fix items and the planner turns them into tasks; QA and the reviewer never create tasks"
  - "the engine, not an agent, runs git and the adapter (after_pass: ship); the release manager only writes the commit plan and the PR body"
  - "S9 feedback is a stage (feedback) that runs when PR comments were fetched (factory comments --file), using the release-manager agent's triage skill"
  - "acceptance criteria carry their text in the spec ({id, text}); Suggestions/04 lists AC ids only"
  - "context: fork is used on /factory:doctor; failure-analysis needs none because the diagnostician already runs in its own context"
