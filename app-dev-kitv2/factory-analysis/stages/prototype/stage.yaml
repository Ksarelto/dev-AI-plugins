id: prototype
title: S2.5 Prototype (optional)
kind: agents
agents: ["role:prototyper"]
when: prototype.trigger
context_role: prototype_role
inputs: [stories, ux-notes?, app-profile?, capability-index?, component-inventory?]
outputs: [prototype-report, prototype-sandbox]
gate: proto
human_gate: GATE-P
on_approve: spec_delta   # breaking spec deltas go back to requirements on approval
requires: { factory: "^0.1" }
