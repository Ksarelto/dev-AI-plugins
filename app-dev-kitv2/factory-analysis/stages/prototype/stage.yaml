id: prototype
title: S2.5 Living app prototype (static HTML, updated by every feature with a UI change)
kind: agents
# The designer updates the shared design, shell and screens.yaml; then one prototyper dispatch per
# screen it marked added or changed runs in parallel. The engine snapshots .factory/prototype/ first.
agents: ["role:prototype_designer"]
fan_out: { agent: "role:prototyper", over: prototype-screens }
snapshot: prototype
when: prototype.trigger
context_role: prototype_role
inputs: [stories, ux-notes?, "prd|delta-spec", prototype-screens?, prototype-design-brief?, prototype-screen-notes?, design-inputs?, normalised-sources?, app-profile?, capability-index?, component-inventory?, human-notes?]
outputs: [prototype-report, app-prototype, prototype-screens, prototype-design-brief, prototype-screen-notes]   # notes: one per screen, by the prototypers
gate: proto
human_gate: GATE-P
on_approve: spec_delta   # breaking spec deltas go back to requirements on approval
requires: { factory: "^0.1" }
