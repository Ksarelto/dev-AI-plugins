# Spec Front Matter Template — schema 2.0
# Used by: spec-synthesizer (Station 6). status starts at "reviewing" — never "approved".
# Replace ALL {{PLACEHOLDER}} values; validate-spec.mjs rejects any left over (PLACEHOLDER_LEFT).
# Full schema and validation rules: ../references/spec-schema.md
# One home per fact: write each item once, reference it by id everywhere else.

---
spec-version: "2.0"
timecode: "{{YYYYMMDD-HHmmss}}"
type: "{{feature|app|domain|integration}}"
status: "reviewing"

metadata:
  slug: "{{kebab-case-app-slug}}"
  title: "{{Human-Readable Title}}"
  created: "{{YYYY-MM-DDTHH:mm:ssZ}}"
  updated: "{{YYYY-MM-DDTHH:mm:ssZ}}"
  source-files:
    - "{{requirements.md}}"
  pipeline-rounds: { clarification: 0, completeness: 0, review: 0 }

context:
  problem: "{{1–3 sentences: what is broken today and for whom}}"
  goal: "{{what success looks like}}"
  target-users: ["{{Role name from roles[]}}"]
  existing-system: "{{What exists today, or 'None — greenfield'}}"
  constraints:
    - "{{Binding limit, e.g. 'One building only; no cross-building lending'}}"
  non-goals:
    - "{{Explicitly not doing, e.g. 'Payments or deposits'}}"
  success-metrics:                         # omit when the source states none
    - id: KPI-001
      metric: "{{e.g. Distinct items listed}}"
      target: "{{e.g. >= 40}}"
      window: "{{e.g. first 3 months}}"

glossary:                                  # copy the source's glossary; add terms the build must not confuse
  - term: "{{Hold}}"
    meaning: "{{Short period after a yes when the item is promised to one borrower}}"

# Atomic register: one testable statement per entry. Every MUST/MUST NOT, every table row, every
# number (limits, timers, retention) in the source becomes one entry with source-ref file#Lline.
requirements:
  - id: REQ-001
    text: "{{A resident may have at most three active borrows at a time}}"
    kind: "{{behavior|rule|constraint|nfr|data|copy|metric}}"
    source: "{{stated|answered}}"
    source-ref: "{{requirements.md#L364}}"
    priority: "{{must|should|could|wont}}"
    scope: "in"
    covered-by: ["{{BR-001}}", "{{AC-002}}"]

roles:
  - name: "{{Resident}}"
    description: "{{Who they are and how they get access}}"

permissions:                               # roles not listed are denied
  - id: PERM-001
    action: "{{Hide or retire any listing}}"
    allow: ["{{Manager}}"]
    conditional:
      "{{Resident}}": "{{only for listings they own}}"
    denied-behavior: "{{Refused in plain words with 'ask the manager' as the next step}}"
    refs: ["{{API-003}}"]
    ac-refs: ["{{AC-012}}"]

entities:
  # Complete field list with real TS types. Descriptions say what the value MEANS and its
  # constraints — never "Field x.". Enum fields list values[] AND end the description with
  # "One of: …" (older prototype readers parse it). Display-only computed fields: derived: true.
  - name: "{{EntityName}}"
    description: "{{What one record represents in the domain}}"
    retention: "{{e.g. kept 12 months after return, then summarised}}"
    fields:
      - name: "id"
        type: "string"
        required: true
        description: "Stable identifier, never reused"
      - name: "{{ownerId}}"
        type: "string"
        required: true
        description: "{{The Resident who listed it; set at creation, changed only by a manager transfer}}"
      - name: "status"
        type: "{{EntityName}}Status"
        required: true
        values: ["{{FREE}}", "{{PROMISED}}", "{{OUT}}"]
        description: "{{Lifecycle; see SM-001. One of: FREE, PROMISED, OUT}}"
    relationships:
      - entity: "{{Resident}}"
        type: "many-to-one"
        via: "{{ownerId}}"
        description: "{{Each listing has one lender; a lender has many listings}}"

state-machines:                            # one per lifecycle field with 2+ values
  - id: SM-001
    entity: "{{EntityName}}"
    field: "status"
    initial: "{{FREE}}"
    states: ["{{FREE}}", "{{PROMISED}}", "{{OUT}}"]
    transitions:
      - from: "{{FREE}}"
        to: "{{PROMISED}}"
        trigger: "{{Lender accepts a request}}"
        actor: "{{Resident}}"                  # or a list of role names
        api-ref: "{{API-001}}"                 # the endpoint that causes it (human actors)
        guard: ["{{BR-002}}"]
        effects: ["{{NTF-001}}"]
        ac-refs: ["{{AC-001}}"]
      - from: "{{PROMISED}}"
        to: "{{FREE}}"
        trigger: "{{Collect window ends with no collect recorded}}"
        actor: "system"
        after: "{{PT12H}}"
        effects: ["{{NTF-002}}"]
        ac-refs: ["{{AC-003}}"]

business-rules:
  - id: BR-001
    name: "{{active-borrow-cap}}"
    rule: "{{A resident may have at most 3 active borrows (waiting + holds + out)}}"
    params: { max: 3 }
    applies-to: ["{{BorrowRequest}}"]
    on-violation: "{{Request refused; say the three-borrow rule is in the way and what to do next}}"
    ac-refs: ["{{AC-002}}"]

user-stories:
  - id: US-001
    as: "{{Role name}}"
    i-want: "{{ONE capability}}"
    so-that: "{{benefit}}"
    priority: "{{must|should|could|wont}}"

acceptance-criteria:                       # every must story: ≥1 happy AND ≥1 error/edge/permission
  - id: AC-001
    story-ref: US-001
    kind: happy
    given: "{{Starting state}}"
    when: "{{User action}}"
    then: "{{Observable outcome}}"
    testable: true
  - id: AC-002
    story-ref: US-001
    kind: error
    given: "{{The resident already has three active borrows}}"
    when: "{{They send another request}}"
    then: "{{The request is refused and they see which rule is in the way and what to do}}"
    testable: true

api-surface:
  endpoints:                               # ONE list for reads and writes; no `mutations`
    - id: API-001
      method: "{{GET|POST|PUT|PATCH|DELETE}}"
      path: "{{/v1/resources/{id}}}"
      description: "{{What it does}}"
      auth-required: true                  # false only for public calls (e.g. starting a session)
      roles: ["{{Role name}}"]
      story-refs: ["US-001"]
      request:
        path-params: { id: "string" }
        query-params: {}
        body: {}
      response:
        success: { status: 200, schema: "{{EntityName}}" }
        errors:
          - status: 409
            code: "{{ACTIVE_BORROW_CAP}}"
            message: "{{User-facing text}}"
            when: "{{BR-001}}"

# Optional — omit the whole block when the product has no AI.
agent-surface:
  agents:
    - id: AGT-001
      name: "{{kebab-case-agent-name}}"
      kind: "{{conversational|rag|tool-using|graph}}"
      runtime: "{{openai-agents|langgraph}}"
      description: "{{What this agent does for the user}}"
      tool-refs: ["TOOL-001"]
      knowledge-base-refs: []
      embed: "{{none|backend-route|frontend-widget}}"
  tools:
    - id: TOOL-001
      name: "{{tool-name}}"
      description: "{{What the tool does}}"
      api-ref: "API-001"
  knowledge-bases: []

ui-surface:
  screens:
    - id: SCR-001
      title: "{{Screen Title}}"
      route: "{{/path/:id}}"
      page-type: "{{list|detail|form|dashboard|settings|other}}"
      primary-entity: "{{EntityName}}"
      roles: ["{{Role name}}"]
      story-refs: ["US-001"]
      api-refs: ["API-001"]
      states: [loading, empty, error, success]
      components: ["{{ProfilesTable}}", "{{StatusFilterDropdown}}", "{{CreateProfileModal}}"]
      notes: "{{List and filter all Profiles; each row opens the profile detail.}}"
  interactions:
    - id: INT-001
      trigger: "{{clicks Create Profile}}"
      response: "{{opens CreateProfileModal}}"
      screen-ref: SCR-001

notifications:
  - id: NTF-001
    event: "{{My request was accepted}}"
    recipients: ["{{borrower}}"]
    channels: ["in-app"]
    mandatory: false
    timing: "{{immediately}}"
    copy: "{{Marta in 4B accepted: collect Saturday 10:00–12:00, back by Sunday 18:00.}}"
    ac-refs: ["AC-001"]

non-functional:
  performance: ["{{Measurable target from the source, e.g. 'Catalogue status visible in < 1 s p95'}}"]
  accessibility: ["{{e.g. WCAG 2.2 AA for core flows; status as words, not colour}}"]
  security: ["{{e.g. Catalogue visible only to admitted adults}}"]
  scalability: ["{{e.g. ~100 items, ~150 adults}}"]
  observability: ["{{e.g. Manager activity log: who, what, when, why}}"]

boundaries:
  always: ["{{e.g. Show status as words}}"]
  ask-first: ["{{e.g. Adding a notification channel}}"]
  never: ["{{e.g. Take payments}}"]

delivery-plan:
  strategy: "{{Why this order, e.g. 'Access first, then the lending loop, then oversight'}}"
  slices:
    - id: SL-001
      title: "{{Feature name downstream kits will use}}"
      goal: "{{User-visible outcome when done}}"
      depends-on: []
      tracks: [backend, frontend]
      story-refs: ["US-001"]
      entity-refs: ["{{EntityName}}"]
      api-refs: ["API-001"]
      screen-refs: ["SCR-001"]
      agent-refs: []
      rule-refs: ["BR-001"]
      state-machine-refs: ["SM-001"]
      notification-refs: ["NTF-001"]
      permission-refs: ["PERM-001"]
      steps:
        - track: backend
          do: "{{Model EntityName with its SM-001 lifecycle and enforce BR-001 on create}}"
          refs: ["{{EntityName}}", "SM-001", "BR-001", "API-001"]
        - track: frontend
          do: "{{Build SCR-001 with all four states, calling API-001}}"
          refs: ["SCR-001", "API-001"]
      done-when: ["AC-001", "AC-002"]

risks:
  - id: RISK-001
    description: "{{Risk}}"
    likelihood: "{{low|medium|high}}"
    impact: "{{low|medium|high}}"
    mitigation: "{{Mitigation; reference Q-/ASSM-/DEC- ids instead of restating them}}"

assumptions:                               # inferences only — never a stated rule; one claim each
  - id: ASSM-001
    description: "{{One inferred claim}}"
    source: "{{analyst|enricher}}"
    confidence: "{{low|medium|high}}"
    requires-confirmation: true
    affects: ["{{SL-001}}"]

open-questions:
  - id: Q-001
    question: "{{Unanswered question}}"
    raised-by: "{{analyst|enricher|user|review}}"
    blocking: false
    affects: ["{{SL-001}}"]
    status: "open"
    answer: ""

traceability:
  decisions:
    - id: DEC-001
      decision: "{{What was decided}}"
      rationale: "{{Why}}"
      alternatives-considered: ["{{Alternative and why rejected}}"]
      source: "{{qa|context|review}}"
      affects: ["{{US-001}}"]
---
